server:
  port: ${PORT:8081}
spring:
  application:
    name: user-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:userdb}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

jwt:
  secret: ${JWT_SECRET:dev-secret-dev-secret-dev-secret-dev-secret}
  ttl-minutes: 60
